<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hamara Market - Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(145deg,#eef3ff,#ffffff);
  color:#17213b;
  min-height:100vh;
}

.header{
  display:flex;
  align-items:center;
  padding:18px 24px;
  background:#fff;
  border-bottom:1px solid #e4e8f0;
}

.logo{
  width:52px;
  height:52px;
  border-radius:16px;
  background:linear-gradient(145deg,#2463df,#1847b5);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:800;
}

.brand{
  margin-left:12px;
  font-size:25px;
  font-weight:800;
  color:#173b9e;
}

.wrap{
  max-width:470px;
  margin:45px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border-radius:25px;
  padding:30px 25px;
  box-shadow:0 18px 55px #1d35651c;
  border:1px solid #e9edf5;
}

.title{
  text-align:center;
  font-size:30px;
  margin:4px 0 8px;
  color:#173b9e;
}

.sub{
  text-align:center;
  color:#69748b;
  margin:0 0 28px;
  line-height:1.5;
}

label{
  display:block;
  font-weight:700;
  margin:17px 0 8px;
}

.password{
  position:relative;
}

input{
  width:100%;
  padding:16px;
  border:1px solid #d9deea;
  border-radius:13px;
  font-size:16px;
  outline:none;
  background:#fafbfe;
}

input:focus{
  border-color:#2463df;
  box-shadow:0 0 0 3px #2463df18;
}

.password input{
  padding-right:55px;
}

.eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
}

.update{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  margin-top:25px;
  background:linear-gradient(90deg,#245fe0,#3d48df);
  color:white;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.update:disabled{
  opacity:.65;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  font-weight:700;
  line-height:1.5;
}

.success{
  color:#16834b;
}

.error{
  color:#d22f2f;
}

.login-link{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#2463df;
  text-decoration:none;
  font-weight:700;
}

@media(max-width:520px){

  .header{
    padding:15px 16px;
  }

  .brand{
    font-size:22px;
  }

  .logo{
    width:48px;
    height:48px;
  }

  .wrap{
    margin:28px auto;
  }

  .card{
    padding:27px 20px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    HM
  </div>

  <div class="brand">
    Hamara Market
  </div>

</header>

<main class="wrap">

<section class="card">

<h1 class="title">
  Reset Password
</h1>

<p class="sub">
  Create a new password for your Hamara Market account.
</p>

<form id="resetForm">

<label for="newPassword">
  New Password
</label>

<div class="password">

<input
  id="newPassword"
  type="password"
  minlength="8"
  placeholder="Minimum 8 characters"
  required
>

<button
  class="eye"
  type="button"
  onclick="togglePassword('newPassword')"
>
  👁
</button>

</div>


<label for="confirmPassword">
  Confirm Password
</label>

<div class="password">

<input
  id="confirmPassword"
  type="password"
  minlength="8"
  placeholder="Confirm new password"
  required
>

<button
  class="eye"
  type="button"
  onclick="togglePassword('confirmPassword')"
>
  👁
</button>

</div>


<button
  class="update"
  id="updateBtn"
  type="submit"
>
  Update Password
</button>

</form>


<div
  id="message"
  class="message"
></div>


<a
  class="login-link"
  href="login.html"
>
  ← Back to Login
</a>

</section>

</main>


<script>

/* ==============================
   SUPABASE
   ============================== */

const SUPABASE_URL =
  "https://yaxingstvkqafmvtyuis.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_3dA1_NPBVCHCzcrf155Qtw_16IUxNDt";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* ==============================
   SHOW / HIDE PASSWORD
   ============================== */

function togglePassword(id){

  const input =
    document.getElementById(id);

  input.type =
    input.type === "password"
    ? "text"
    : "password";
}


/* ==============================
   CHECK RESET SESSION
   ============================== */

supabaseClient.auth.onAuthStateChange(
  function(event, session){

    if(event === "PASSWORD_RECOVERY"){

      const message =
        document.getElementById("message");

      message.className =
        "message success";

      message.textContent =
        "You can now create your new password.";

    }

  }
);


/* ==============================
   UPDATE PASSWORD
   ============================== */

document
.getElementById("resetForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const newPassword =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const button =
    document.getElementById("updateBtn");

  const message =
    document.getElementById("message");


  message.textContent = "";


  if(newPassword.length < 8){

    message.className =
      "message error";

    message.textContent =
      "Password must be at least 8 characters.";

    return;

  }


  if(newPassword !== confirmPassword){

    message.className =
      "message error";

    message.textContent =
      "New Password and Confirm Password do not match.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Updating...";


  const {error} =
    await supabaseClient.auth.updateUser({

      password:newPassword

    });


  if(error){

    button.disabled = false;

    button.textContent =
      "Update Password";

    message.className =
      "message error";

    message.textContent =
      "❌ " + error.message;

    return;

  }


  message.className =
    "message success";

  message.textContent =
    "✅ Password updated successfully. Redirecting to Login...";


  setTimeout(async function(){

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

  },1800);

});

</script>

</body>
</html>
