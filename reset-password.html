<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hamara Market - Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(145deg,#eef3ff,#ffffff);
    color:#17213b;
    min-height:100vh;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 24px;
    background:#ffffff;
    border-bottom:1px solid #e4e8f0;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:24px;
    font-weight:800;
    color:#173b9e;
}

.logo{
    width:52px;
    height:52px;
    border-radius:16px;
    background:linear-gradient(145deg,#2463df,#1847b5);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:800;
    box-shadow:0 8px 20px #245d9333;
}

.wrap{
    max-width:470px;
    margin:45px auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:32px 28px;
    box-shadow:0 12px 40px #163b7918;
    border:1px solid #e5e9f2;
}

.title{
    text-align:center;
    font-size:34px;
    margin:0 0 10px;
}

.sub{
    text-align:center;
    color:#697386;
    font-size:17px;
    line-height:1.5;
    margin-bottom:28px;
}

label{
    display:block;
    font-weight:700;
    margin:18px 0 8px;
}

.password{
    position:relative;
}

input{
    width:100%;
    padding:15px 55px 15px 15px;
    border:1px solid #ccd4e2;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2463df;
    box-shadow:0 0 0 3px #2463df18;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    font-size:20px;
    cursor:pointer;
}

.update{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    margin-top:25px;
    background:linear-gradient(90deg,#245fe0,#3d48df);
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.update:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    font-weight:700;
    line-height:1.5;
}

.success{
    color:#16834b;
}

.error{
    color:#d22f2f;
}

.login-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#2463df;
    text-decoration:none;
    font-weight:700;
}

.login-link:hover{
    text-decoration:underline;
}

.hidden{
    display:none;
}

.loading{
    text-align:center;
    padding:20px;
    font-weight:700;
    color:#2463df;
}

@media(max-width:520px){

    .header{
        padding:15px 16px;
    }

    .brand{
        font-size:22px;
    }

    .
