<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Hamara Market - Reset Password</title>

<!-- SUPABASE JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(145deg,#eef3ff,#ffffff);
    color:#17213b;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 24px;
    background:#ffffff;
    border-bottom:1px solid #e4e8f0;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:24px;
    font-weight:800;
    color:#173b9e;
}

.logo{
    width:52px;
    height:52px;
    border-radius:16px;
    background:linear-gradient(145deg,#2463df,#1847b5);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:800;
    box-shadow:0 8px 20px #245d9333;
}


/* =========================
   MAIN
========================= */

.wrap{
    max-width:470px;
    margin:45px auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:32px 28px;
    box-shadow:0 12px 40px #163b7918;
    border:1px solid #e5e9f2;
}


/* =========================
   TITLE
========================= */

.title{
    text-align:center;
    font-size:34px;
    margin:0 0 10px;
    color:#17213b;
}

.sub{
    text-align:center;
    color:#697386;
    font-size:17px;
    line-height:1.5;
    margin-bottom:28px;
}


/* =========================
   LABEL
========================= */

label{
    display:block;
    font-weight:700;
    margin:18px 0 8px;
}


/* =========================
   PASSWORD
========================= */

.password{
    position:relative;
}

input{
    width:100%;
    padding:15px 55px 15px 15px;
    border:1px solid #ccd4e2;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2463df;
    box-shadow:0 0 0 3px #2463df18;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    font-size:20px;
    cursor:pointer;
    padding:5px;
}


/* =========================
   UPDATE BUTTON
========================= */

.update{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    margin-top:25px;
    background:linear-gradient(90deg,#245fe0,#3d48df);
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.update:disabled{
    opacity:.65;
    cursor:not-allowed;
}


/* =========================
   MESSAGE
========================= */

.message{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    font-weight:700;
    line-height:1.5;
}

.success{
    color:#16834b;
}

.error{
    color:#d22f2f;
}


/* =========================
   LOGIN LINK
========================= */

.login-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#2463df;
    text-decoration:none;
    font-weight:700;
}

.login-link:hover{
    text-decoration:underline;
}


/* =========================
   HIDDEN
========================= */

.hidden{
    display:none !important;
}


/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:20px;
    font-weight:700;
    color:#2463df;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    .header{
        padding:15px 16px;
    }

    .brand{
        font-size:22px;
    }

    .logo{
        width:48px;
        height:48px;
        font-size:25px;
    }

    .wrap{
        margin:28px auto;
        padding:14px;
    }

    .card{
        padding:27px 20px;
    }

    .title{
        font-size:30px;
    }

    .sub{
        font-size:16px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="brand">

        <div class="logo">
            HM
        </div>

        <div>
            Hamara Market
        </div>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="wrap">

<section class="card">


    <h1 class="title">
        Reset Password
    </h1>


    <p class="sub">
        Create a new password for your Hamara Market account.
    </p>



    <!-- =========================
         LOADING
    ========================== -->

    <div
        id="loading"
        class="loading">

        Checking password reset link...

    </div>



    <!-- =========================
         RESET FORM
    ========================== -->

    <form
        id="resetForm"
        class="hidden">


        <!-- NEW PASSWORD -->

        <label for="newPassword">
            New Password
        </label>


        <div class="password">

            <input
                id="newPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                placeholder="Minimum 8 characters"
                required
            >


            <button
                class="eye"
                type="button"
                onclick="togglePassword('newPassword')"
                aria-label="Show or hide password">

                👁

            </button>

        </div>



        <!-- CONFIRM PASSWORD -->

        <label for="confirmPassword">
            Confirm Password
        </label>


        <div class="password">

            <input
                id="confirmPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                placeholder="Confirm new password"
                required
            >


            <button
                class="eye"
                type="button"
                onclick="togglePassword('confirmPassword')"
                aria-label="Show or hide password">

                👁

            </button>

        </div>



        <!-- UPDATE -->

        <button
            id="updateBtn"
            class="update"
            type="submit">

            Update Password

        </button>


    </form>



    <!-- =========================
         MESSAGE
    ========================== -->

    <div
        id="message"
        class="message">

    </div>



    <!-- =========================
         LOGIN
    ========================== -->

    <a
        class="login-link"
        href="login.html">

        ← Back to Login

    </a>


</section>

</main>



<script>


/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

/*
   IMPORTANT:

   This URL MUST be the same Supabase project
   used in login.html.
*/

const SUPABASE_URL =
"https://yaxingstvkaqfmvtyuis.supabase.co";


/*
   Supabase Publishable Key

   DO NOT replace this with a secret/service-role key.
*/

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_3dA1_NPBVCHCzcrf155Qtw_16IUxNDt";


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY,

    {

        auth:{

            persistSession:true,

            autoRefreshToken:true,

            detectSessionInUrl:true

        }

    }

);



/* =====================================================
   ELEMENTS
===================================================== */

const loading =
document.getElementById("loading");


const resetForm =
document.getElementById("resetForm");


const message =
document.getElementById("message");


const updateBtn =
document.getElementById("updateBtn");



/* =====================================================
   TOGGLE PASSWORD
===================================================== */

function togglePassword(id){

    const input =
    document.getElementById(id);


    if(input.type === "password"){

        input.type = "text";

    }else{

        input.type = "password";

    }

}



/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

}



/* =====================================================
   SHOW RESET FORM
===================================================== */

function showResetForm(){

    loading.classList.add("hidden");

    resetForm.classList.remove("hidden");

}



/* =====================================================
   SHOW INVALID LINK
===================================================== */

function showInvalidLink(){

    loading.classList.add("hidden");

    resetForm.classList.add("hidden");

    showMessage(

        "This password reset link is invalid or expired. Please request a new reset link.",

        "error"

    );

}



/* =====================================================
   SUPABASE AUTH STATE CHANGE
===================================================== */

supabaseClient.auth.onAuthStateChange(

    async function(event,session){

        console.log(
            "Supabase Auth Event:",
            event
        );


        /*
           PASSWORD_RECOVERY

           This is the most important event
           for password reset.
        */

        if(event === "PASSWORD_RECOVERY"){

            console.log(
                "Password recovery session detected."
            );


            showResetForm();


            showMessage(

                "You can now create your new password.",

                "success"

            );

        }


        /*
           SIGNED_IN

           Sometimes Supabase establishes
           the recovery session using SIGNED_IN.
        */

        if(event === "SIGNED_IN" && session){

            console.log(
                "Recovery session signed in."
            );


            if(
                resetForm.classList.contains(
                    "hidden"
                )
            ){

                showResetForm();

            }

        }

    }

);



/* =====================================================
   CHECK RECOVERY SESSION
===================================================== */

async function checkRecoverySession(){

    try{

        console.log(
            "Checking recovery session..."
        );


        /*
           Check current session.
        */

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            console.error(
                "Session error:",
                error
            );

            showInvalidLink();

            return;

        }


        /*
           If session already exists,
           password reset form can be shown.
        */

        if(
            data &&
            data.session
        ){

            console.log(
                "Existing recovery session found."
            );


            showResetForm();

            return;

        }


        /*
           IMPORTANT:

           Give Supabase enough time to process
           the recovery URL.
        */

        console.log(
            "Waiting for recovery session..."
        );


        setTimeout(

            async function(){

                try{

                    const {
                        data:secondData,
                        error:secondError
                    } =
                    await supabaseClient
                    .auth
                    .getSession();


                    if(secondError){

                        console.error(
                            "Second session error:",
                            secondError
                        );

                        showInvalidLink();

                        return;

                    }


                    if(
                        secondData &&
                        secondData.session
                    ){

                        console.log(
                            "Recovery session found after waiting."
                        );


                        showResetForm();

                    }else{

                        /*
                           Before showing invalid,
                           check whether the URL actually
                           contains a Supabase recovery token.
                        */

                        const hash =
                        window.location.hash;


                        const query =
                        window.location.search;


                        const hasRecoveryData =
                            hash.includes(
                                "access_token"
                            ) ||
                            hash.includes(
                                "type=recovery"
                            ) ||
                            query.includes(
                                "code="
                            );


                        if(hasRecoveryData){

                            /*
                              Token exists but session
                              may still be processing.
                            */

                            console.log(
                                "Recovery token detected in URL."
                            );


                            setTimeout(

                                async function(){

                                    const {
                                        data:thirdData
                                    } =
                                    await supabaseClient
                                    .auth
                                    .getSession();


                                    if(
                                        thirdData &&
                                        thirdData.session
                                    ){

                                        showResetForm();

                                    }else{

                                        showInvalidLink();

                                    }

                                },

                                1500

                            );

                        }else{

                            showInvalidLink();

                        }

                    }

                }catch(secondError){

                    console.error(
                        "Recovery session retry error:",
                        secondError
                    );

                    showInvalidLink();

                }

            },

            1500

        );

    }catch(error){

        console.error(
            "Recovery check error:",
            error
        );

        showInvalidLink();

    }

}



/* =====================================================
   UPDATE PASSWORD
===================================================== */

resetForm.addEventListener(

    "submit",

    async function(e){

        e.preventDefault();


        const newPassword =
        document
        .getElementById("newPassword")
        .value;


        const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


        message.textContent = "";


        /* =========================
           PASSWORD LENGTH
        ========================== */

        if(newPassword.length < 8){

            showMessage(

                "Password must be at least 8 characters.",

                "error"

            );

            return;

        }


        /* =========================
           PASSWORD MATCH
        ========================== */

        if(
            newPassword !==
            confirmPassword
        ){

            showMessage(

                "New Password and Confirm Password do not match.",

                "error"

            );

            return;

        }


        /* =========================
           CHECK SESSION
        ========================== */

        const {
            data:sessionData,
            error:sessionError
        } =
        await supabaseClient
        .auth
        .getSession();


        if(
            sessionError ||
            !sessionData ||
            !sessionData.session
        ){

            showMessage(

                "Your reset session has expired. Please request a new reset link.",

                "error"

            );

            return;

        }


        /* =========================
           DISABLE BUTTON
        ========================== */

        updateBtn.disabled = true;

        updateBtn.textContent =
            "Updating...";


        try{


            /* =========================
               UPDATE PASSWORD
            ========================== */

            const {
                data,
                error
            } =
            await supabaseClient
            .auth
            .updateUser({

                password:newPassword

            });


            if(error){

                console.error(
                    "Password update error:",
                    error
                );


                updateBtn.disabled = false;

                updateBtn.textContent =
                    "Update Password";


                showMessage(

                    "❌ " +
                    (
                        error.message ||
                        "Unable to update password."
                    ),

                    "error"

                );

                return;

            }


            console.log(
                "Password successfully updated:",
                data
            );


            /* =========================
               SUCCESS
            ========================== */

            showMessage(

                "✅ Password updated successfully. Redirecting to Login...",

                "success"

            );


            updateBtn.textContent =
                "Password Updated";


            /* =========================
               SIGN OUT
            ========================== */

            setTimeout(

                async function(){

                    await supabaseClient
                    .auth
                    .signOut();


                    /*
                       Redirect to login page.
                    */

                    window.location.href =
                        "login.html";

                },

                2000

            );


        }catch(error){

            console.error(
                "Unexpected password update error:",
                error
            );


            updateBtn.disabled = false;

            updateBtn.textContent =
                "Update Password";


            showMessage(

                "❌ Something went wrong. Please try again.",

                "error"

            );

        }

    }

);



/* =====================================================
   START RECOVERY CHECK
===================================================== */

checkRecoverySession();


</script>

</body>

</html>
