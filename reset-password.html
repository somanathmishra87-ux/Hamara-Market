<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hamara Market - Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(145deg,#eef3ff,#ffffff);
  color:#17213b;
  min-height:100vh;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 24px;
  background:#fff;
  border-bottom:1px solid #e4e8f0;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:25px;
  color:#173b9e;
}

.logo{
  width:52px;
  height:52px;
  border-radius:16px;
  background:linear-gradient(145deg,#2463df,#1847b5);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
  box-shadow:0 8px 20px #245ed933;
}

.login{
  text-decoration:none;
  background:#2463df;
  color:white;
  padding:13px 20px;
  border-radius:12px;
  font-weight:700;
}

.wrap{
  max-width:470px;
  margin:45px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border-radius:25px;
  padding:30px 25px;
  box-shadow:0 18px 55px #1d35651c;
  border:1px solid #e9edf5;
}

.title{
  text-align:center;
  font-size:30px;
  margin:4px 0 8px;
}

.sub{
  text-align:center;
  color:#69748b;
  margin:0 0 28px;
  line-height:1.5;
}

label{
  display:block;
  font-weight:700;
  margin:17px 0 8px;
}

.password{
  position:relative;
}

input{
  width:100%;
  padding:16px;
  border:1px solid #d9deea;
  border-radius:13px;
  font-size:16px;
  outline:none;
  background:#fafbfe;
}

.password input{
  padding-right:55px;
}

input:focus{
  border-color:#2463df;
  box-shadow:0 0 0 3px #2463df18;
}

.eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
}

.update{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  margin-top:24px;
  background:linear-gradient(90deg,#245fe0,#3d48df);
  color:white;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.update:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:12px;
  text-align:center;
  font-weight:600;
  line-height:1.5;
}

.success{
  background:#e9f9ef;
  color:#08752f;
}

.error{
  background:#fff0f0;
  color:#c62828;
}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#2463df;
  text-decoration:none;
  font-weight:700;
}

.footer{
  text-align:center;
  color:#8b93a2;
  font-size:12px;
  margin:22px;
}

@media(max-width:520px){

  .header{
    padding:15px 16px;
  }

  .brand{
    font-size:22px;
  }

  .logo{
    width:48px;
    height:48px;
  }

  .login{
    padding:11px 15px;
  }

  .wrap{
    margin:28px auto;
  }

  .card{
    padding:27px 20px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">
    <div class="logo">HM</div>
    <span>Hamara Market</span>
  </div>

  <a class="login" href="login.html">Login</a>

</header>


<main class="wrap">

  <section class="card">

    <h1 class="title">Reset Password</h1>

    <p class="sub">
      Enter your new password for your Hamara Market account.
    </p>


    <form id="resetForm">

      <label for="password">
        New Password
      </label>

      <div class="password">

        <input
          id="password"
          type="password"
          minlength="8"
          placeholder="Minimum 8 characters"
          required
        >

        <button
          class="eye"
          type="button"
          onclick="togglePassword('password')"
          aria-label="Show password"
        >
          👁
        </button>

      </div>


      <label for="confirmPassword">
        Confirm New Password
      </label>

      <div class="password">

        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          placeholder="Re-enter new password"
          required
        >

        <button
          class="eye"
          type="button"
          onclick="togglePassword('confirmPassword')"
          aria-label="Show password"
        >
          👁
        </button>

      </div>


      <button
        id="updateButton"
        class="update"
        type="submit"
      >
        Update Password
      </button>

    </form>


    <div id="message" class="message"></div>


    <a class="back" href="login.html">
      ← Back to Login
    </a>

  </section>

</main>


<div class="footer">
  © 2026 Hamara Market. All rights reserved.
</div>


<script>

/* ==========================================
   HAMARA MARKET - SUPABASE CONFIGURATION
   ========================================== */

const SUPABASE_URL =
  "https://yaxingstvkqafmvtyuis.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_3dA1_NPBVCHCzcrf155Qtw_16IUxNDt";


const { createClient } =
  window.supabase;

const supabaseClient =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ==========================================
   SHOW / HIDE PASSWORD
   ========================================== */

function togglePassword(id){

  const input =
    document.getElementById(id);

  if(input.type === "password"){
    input.type = "text";
  }else{
    input.type = "password";
  }

}


/* ==========================================
   MESSAGE
   ========================================== */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  box.style.display = "block";

}


/* ==========================================
   CHECK RECOVERY SESSION
   ========================================== */

supabaseClient.auth.onAuthStateChange(
  function(event, session){

    console.log(
      "Auth event:",
      event
    );

  }
);


/* ==========================================
   UPDATE PASSWORD
   ========================================== */

document
.getElementById("resetForm")
.addEventListener("submit", async function(e){

  e.preventDefault();


  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const button =
    document.getElementById("updateButton");


  if(password.length < 8){

    showMessage(
      "Password must contain at least 8 characters.",
      "error"
    );

    return;
  }


  if(password !== confirmPassword){

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Updating Password...";


  try{

    const { data, error } =
      await supabaseClient.auth.updateUser({
        password: password
      });


    if(error){
      throw error;
    }


    showMessage(
      "Password updated successfully! Redirecting to Login...",
      "success"
    );


    document
      .getElementById("resetForm")
      .reset();


    button.textContent =
      "Password Updated";


    setTimeout(function(){

      window.location.href =
        "login.html";

    },3000);


  }catch(error){

    console.error(
      "Password update error:",
      error
    );


    showMessage(
      "Password reset failed: " + error.message,
      "error"
    );


    button.disabled = false;

    button.textContent =
      "Update Password";

  }

});

</script>

</body>
</html>
