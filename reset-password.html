<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hamara Market - Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(145deg,#eef3ff,#ffffff);
    color:#17213b;
    min-height:100vh;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    background:#fff;
    border-bottom:1px solid #e4e8f0;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    font-size:25px;
    color:#173b9e;
}

.logo{
    width:52px;
    height:52px;
    border-radius:16px;
    background:linear-gradient(145deg,#2463df,#1847b5);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:800;
    box-shadow:0 8px 20px #245ed933;
}

.wrap{
    max-width:470px;
    margin:45px auto;
    padding:0 20px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:32px 28px;
    box-shadow:0 12px 40px #163b7918;
    border:1px solid #e5e9f2;
}

.title{
    text-align:center;
    font-size:36px;
    margin:0 0 10px;
}

.sub{
    text-align:center;
    color:#697386;
    font-size:17px;
    line-height:1.5;
    margin-bottom:30px;
}

label{
    display:block;
    font-size:17px;
    font-weight:700;
    margin:18px 0 8px;
}

.password{
    position:relative;
}

input{
    width:100%;
    padding:16px;
    padding-right:55px;
    border:1px solid #d6dce8;
    border-radius:14px;
    background:#fafbfe;
    font-size:17px;
    outline:none;
}

input:focus{
    border-color:#2463df;
    box-shadow:0 0 0 3px #2463df18;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    font-size:20px;
    cursor:pointer;
}

.update{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    margin-top:25px;
    background:linear-gradient(90deg,#245fe0,#3d48df);
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.update:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    font-weight:700;
    line-height:1.5;
}

.success{
    color:#16834b;
}

.error{
    color:#d22f2f;
}

.login-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#2463df;
    text-decoration:none;
    font-weight:700;
    font-size:16px;
}

.status{
    text-align:center;
    margin-bottom:20px;
    padding:12px;
    border-radius:10px;
    background:#eef5ff;
    color:#2457ad;
    font-size:14px;
    display:none;
}

@media(max-width:520px){

    .header{
        padding:15px 16px;
    }

    .brand{
        font-size:22px;
    }

    .logo{
        width:48px;
        height:48px;
    }

    .wrap{
        margin:28px auto;
    }

    .card{
        padding:27px 20px;
    }

    .title{
        font-size:30px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logo">HM</div>
        <div>Hamara Market</div>
    </div>

</header>


<main class="wrap">

<section class="card">

    <h1 class="title">Reset Password</h1>

    <p class="sub">
        Create a new password for your Hamara Market account.
    </p>

    <div id="status" class="status">
        Verifying password reset link...
    </div>


    <form id="resetForm">

        <label for="newPassword">
            New Password
        </label>

        <div class="password">

            <input
                id="newPassword"
                type="password"
                minlength="8"
                placeholder="Minimum 8 characters"
                required
            >

            <button
                class="eye"
                type="button"
                onclick="togglePassword('newPassword')"
            >👁️</button>

        </div>


        <label for="confirmPassword">
            Confirm Password
        </label>

        <div class="password">

            <input
                id="confirmPassword"
                type="password"
                minlength="8"
                placeholder="Confirm new password"
                required
            >

            <button
                class="eye"
                type="button"
                onclick="togglePassword('confirmPassword')"
            >👁️</button>

        </div>


        <button
            class="update"
            id="updateBtn"
            type="submit"
        >
            Update Password
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        class="login-link"
        href="login.html"
    >
        ← Back to Login
    </a>

</section>

</main>


<script>

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
    "https://yxqingtstvkqafmvtyuis.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_3dA1_NPBVHCzcrf155Qtw_16IUXNdT";


/* =========================================
   CREATE SUPABASE CLIENT
========================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* =========================================
   ELEMENTS
========================================= */

const form =
    document.getElementById("resetForm");

const newPassword =
    document.getElementById("newPassword");

const confirmPassword =
    document.getElementById("confirmPassword");

const updateBtn =
    document.getElementById("updateBtn");

const message =
    document.getElementById("message");

const statusBox =
    document.getElementById("status");


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

function togglePassword(id){

    const input =
        document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
    }else{
        input.type = "password";
    }
}


/* =========================================
   MESSAGE FUNCTIONS
========================================= */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent = text;
}


function clearMessage(){

    message.className = "message";

    message.textContent = "";
}


/* =========================================
   SHOW RESET FORM
========================================= */

function enableResetForm(){

    statusBox.style.display = "none";

    form.style.display = "block";

    newPassword.disabled = false;

    confirmPassword.disabled = false;

    updateBtn.disabled = false;
}


/* =========================================
   DISABLE RESET FORM
========================================= */

function disableResetForm(){

    form.style.display = "none";

    statusBox.style.display = "block";

    statusBox.textContent =
        "This password reset link is invalid or expired.";
}


/* =========================================
   AUTH STATE CHANGE
========================================= */

supabaseClient.auth.onAuthStateChange(
    function(event, session){

        console.log(
            "Supabase Auth Event:",
            event
        );

        console.log(
            "Session:",
            session
        );


        if(event === "PASSWORD_RECOVERY"){

            enableResetForm();

            showMessage(
                "You can now create your new password.",
                "success"
            );
        }


        if(event === "SIGNED_IN" && session){

            /*
             * A valid recovery session may arrive
             * as SIGNED_IN depending on the flow.
             */

            enableResetForm();
        }

    }
);


/* =========================================
   INITIAL SESSION CHECK
========================================= */

async function checkRecoverySession(){

    try{

        /*
         * Supabase automatically detects the
         * recovery session from the URL.
         */

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if(error){

            console.error(error);

            disableResetForm();

            return;
        }


        if(data && data.session){

            /*
             * Valid recovery/auth session found.
             */

            enableResetForm();

            return;
        }


        /*
         * Give Supabase a moment to process
         * the password recovery URL.
         */

        setTimeout(async function(){

            const {
                data: secondCheck
            } =
            await supabaseClient.auth.getSession();


            if(
                secondCheck &&
                secondCheck.session
            ){

                enableResetForm();

            }else{

                /*
                 * If there is an error parameter
                 * in the URL, show a clear message.
                 */

                const hash =
                    window.location.hash;

                const params =
                    new URLSearchParams(
                        hash.replace("#","")
                    );

                const errorDescription =
                    params.get(
                        "error_description"
                    );


                if(errorDescription){

                    showMessage(
                        decodeURIComponent(
                            errorDescription.replace(
                                /\+/g,
                                " "
                            )
                        ),
                        "error"
                    );
                }

                /*
                 * Don't immediately hide the form.
                 * The recovery event can still arrive.
                 */

                statusBox.style.display =
                    "block";

                statusBox.textContent =
                    "Waiting for password recovery session...";

            }

        },1500);

    }catch(error){

        console.error(error);

        disableResetForm();
    }
}


/* =========================================
   UPDATE PASSWORD
========================================= */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        clearMessage();


        const password =
            newPassword.value.trim();

        const confirm =
            confirmPassword.value.trim();


        /* Password length */

        if(password.length < 8){

            showMessage(
                "Password must be at least 8 characters.",
                "error"
            );

            return;
        }


        /* Password match */

        if(password !== confirm){

            showMessage(
                "New Password and Confirm Password do not match.",
                "error"
            );

            return;
        }


        /* Check current session */

        const {
            data: sessionData,
            error: sessionError
        } =
        await supabaseClient.auth.getSession();


        if(
            sessionError ||
            !sessionData ||
            !sessionData.session
        ){

            showMessage(
                "Password reset session is missing or expired. Please request a new reset email.",
                "error"
            );

            return;
        }


        /* Disable button */

        updateBtn.disabled = true;

        updateBtn.textContent =
            "Updating...";


        /* Update password */

        const {
            error
        } =
        await supabaseClient.auth.updateUser({
            password:password
        });


        /* Error */

        if(error){

            console.error(
                "Password update error:",
                error
            );

            updateBtn.disabled = false;

            updateBtn.textContent =
                "Update Password";

            showMessage(
                "❌ " + error.message,
                "error"
            );

            return;
        }


        /* Success */

        showMessage(
            "✅ Password updated successfully. Redirecting to Login...",
            "success"
        );


        updateBtn.textContent =
            "Password Updated";


        /*
         * Sign out the recovery session before
         * sending the user to login.
         */

        setTimeout(
            async function(){

                await supabaseClient.auth.signOut();

                window.location.href =
                    "login.html";

            },
            2000
        );

    }
);


/* =========================================
   START
========================================= */

checkRecoverySession();

</script>

</body>
</html>
