<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Hamara Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f8ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #145dcc;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #1769e0;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0d55bd;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #1769e0;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Reset Password</h1>

    <div class="subtitle">
      Set a new password for your Hamara Market account.
    </div>

    <form id="resetForm">

      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="8"
        required
      >

      <button type="submit">
        Set New Password
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="login.html">
      ← Back to Login
    </a>

  </div>


  <script>

    // Supabase Configuration
    const SUPABASE_URL =
      "https://yaxingstvkaqfmvtyuis.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_3dA1_NPBVCHCzcrf155Qtw_16IUxNDt";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // Reset Password
    document
      .getElementById("resetForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const newPassword =
          document.getElementById("newPassword").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const message =
          document.getElementById("message");


        // Password match check
        if (newPassword !== confirmPassword) {

          message.style.color = "red";
          message.textContent =
            "❌ Passwords do not match.";

          return;
        }


        // Minimum password length
        if (newPassword.length < 8) {

          message.style.color = "red";
          message.textContent =
            "❌ Password must be at least 8 characters.";

          return;
        }


        message.style.color = "#1769e0";
        message.textContent =
          "Updating password...";


        const { data, error } =
          await supabaseClient.auth.updateUser({
            password: newPassword
          });


        if (error) {

          message.style.color = "red";
          message.textContent =
            "❌ " + error.message;

          return;
        }


        message.style.color = "green";
        message.textContent =
          "✅ Password successfully changed!";


        document.getElementById("resetForm").reset();


        setTimeout(function() {

          window.location.href = "login.html";

        }, 2000);

      });

  </script>

</body>
</html>
