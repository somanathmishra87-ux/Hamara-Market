<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hamara Market - Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(145deg,#eef3ff,#ffffff);
    color:#17213b;
    min-height:100vh;
}

.header{
    display:flex;
    align-items:center;
    padding:15px 24px;
    background:#fff;
    border-bottom:1px solid #e4e8f0;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:24px;
    font-weight:800;
    color:#173b9e;
}

.logo{
    width:52px;
    height:52px;
    border-radius:16px;
    background:linear-gradient(145deg,#2463df,#1847b5);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:800;
    box-shadow:0 8px 20px #245d9333;
}

.wrap{
    max-width:470px;
    margin:45px auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:32px 28px;
    box-shadow:0 12px 40px #163b7918;
    border:1px solid #e5e9f2;
}

.title{
    text-align:center;
    font-size:34px;
    margin:0 0 10px;
    color:#17213b;
}

.sub{
    text-align:center;
    color:#697386;
    font-size:17px;
    line-height:1.5;
    margin-bottom:28px;
}

label{
    display:block;
    font-weight:700;
    margin:18px 0 8px;
}

.password{
    position:relative;
}

input{
    width:100%;
    padding:15px 55px 15px 15px;
    border:1px solid #ccd4e2;
    border-radius:12px;
    font-size:16px;
    outline:none;
    color:#17213b;
    background:#fff;
}

input:focus{
    border-color:#2463df;
    box-shadow:0 0 0 3px #2463df18;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    font-size:20px;
    cursor:pointer;
}

.update{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    margin-top:25px;
    background:linear-gradient(90deg,#245fe0,#3d48df);
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.update:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    font-weight:700;
    line-height:1.5;
}

.success{
    color:#16834b;
}

.error{
    color:#d22f2f;
}

.login-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#2463df;
    text-decoration:none;
    font-weight:700;
}

.login-link:hover{
    text-decoration:underline;
}

.hidden{
    display:none !important;
}

.loading{
    text-align:center;
    padding:20px;
    font-weight:700;
    color:#2463df;
}

.password-rule{
    margin-top:8px;
    color:#697386;
    font-size:13px;
}

@media(max-width:520px){

    .header{
        padding:15px 16px;
    }

    .brand{
        font-size:22px;
    }

    .logo{
        width:48px;
        height:48px;
    }

    .wrap{
        margin:28px auto;
        padding:14px;
    }

    .card{
        padding:27px 20px;
        border-radius:22px;
    }

    .title{
        font-size:30px;
    }

    .sub{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logo">HM</div>
        <div>Hamara Market</div>
    </div>

</header>


<main class="wrap">

<section class="card">

    <h1 class="title">Reset Password</h1>

    <p class="sub">
        Create a new password for your Hamara Market account.
    </p>


    <!-- LOADING -->

    <div id="loading" class="loading">
        Checking password reset link...
    </div>


    <!-- RESET FORM -->

    <form id="resetForm" class="hidden">

        <label for="newPassword">
            New Password
        </label>

        <div class="password">

            <input
                id="newPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                placeholder="Minimum 8 characters"
                required
            >

            <button
                class="eye"
                type="button"
                onclick="togglePassword('newPassword',this)"
                aria-label="Show password"
            >
                👁️
            </button>

        </div>

        <div class="password-rule">
            Minimum 8 characters
        </div>


        <label for="confirmPassword">
            Confirm Password
        </label>

        <div class="password">

            <input
                id="confirmPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                placeholder="Confirm new password"
                required
            >

            <button
                class="eye"
                type="button"
                onclick="togglePassword('confirmPassword',this)"
                aria-label="Show password"
            >
                👁️
            </button>

        </div>


        <button
            id="updateBtn"
            class="update"
            type="submit"
        >
            Update Password
        </button>

    </form>


    <div id="message" class="message"></div>


    <a
        class="login-link"
        href="login.html"
    >
        ← Back to Login
    </a>

</section>

</main>


<script>

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
"https://yxaginstvkqafmvtyuis.supabase.co";


/*
IMPORTANT:
Paste your EXISTING Supabase
Publishable/Anon key here.

DO NOT paste:
- service_role key
- secret key
- Resend API key
*/

const SUPABASE_PUBLISHABLE_KEY =
"PASTE-YOUR-EXISTING-SUPABASE-PUBLISHABLE-KEY-HERE";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================================
   ELEMENTS
========================================= */

const loading =
document.getElementById("loading");

const resetForm =
document.getElementById("resetForm");

const message =
document.getElementById("message");

const updateBtn =
document.getElementById("updateBtn");

const newPassword =
document.getElementById("newPassword");

const confirmPassword =
document.getElementById("confirmPassword");


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

function togglePassword(id,button){

    const input =
    document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    }else{

        input.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Show password"
        );
    }
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;
}


/* =========================================
   SHOW FORM
========================================= */

function showResetForm(){

    loading.classList.add("hidden");

    resetForm.classList.remove("hidden");

}


/* =========================================
   SHOW ERROR
========================================= */

function showLinkError(){

    loading.classList.add("hidden");

    resetForm.classList.add("hidden");

    showMessage(
        "This password reset link is invalid or expired. Please request a new reset link.",
        "error"
    );
}


/* =========================================
   AUTH STATE CHANGE
========================================= */

supabaseClient.auth.onAuthStateChange(
    async function(event, session){

        console.log(
            "Supabase Auth Event:",
            event
        );


        if(event === "PASSWORD_RECOVERY"){

            showResetForm();

            showMessage(
                "You can now create your new password.",
                "success"
            );

            return;
        }


        /*
        A session can also already exist
        when the page loads.
        */

        if(session && event === "SIGNED_IN"){

            /*
            Do not automatically show the form
            for normal login unless this page
            contains a recovery session.
            */

            const hash =
                window.location.hash;

            const isRecoveryUrl =
                hash.includes("access_token=") ||
                hash.includes("type=recovery");

            if(isRecoveryUrl){

                showResetForm();
            }
        }

    }
);


/* =========================================
   CHECK CURRENT SESSION
========================================= */

async function checkRecoverySession(){

    try{

        /*
        Supabase automatically detects
        password recovery information from
        the URL when detectSessionInUrl=true.
        */

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            console.error(
                "Session error:",
                error
            );

            showLinkError();

            return;
        }


        /*
        Check URL for recovery token.
        */

        const hash =
            window.location.hash;

        const search =
            window.location.search;

        const hasRecoveryToken =
            hash.includes("access_token=") ||
            hash.includes("type=recovery") ||
            search.includes("code=");


        if(data.session && hasRecoveryToken){

            showResetForm();

            return;
        }


        /*
        Wait briefly for PASSWORD_RECOVERY
        event to be processed.
        */

        setTimeout(
            async function(){

                const {
                    data: secondCheck
                } =
                await supabaseClient.auth.getSession();


                if(secondCheck.session){

                    /*
                    Only show form if this page
                    came through a recovery URL.
                    */

                    const currentHash =
                        window.location.hash;

                    const currentSearch =
                        window.location.search;

                    const recoveryDetected =
                        currentHash.includes("access_token=") ||
                        currentHash.includes("type=recovery") ||
                        currentSearch.includes("code=");


                    if(recoveryDetected){

                        showResetForm();

                        return;
                    }
                }


                showLinkError();

            },
            1200
        );

    }catch(error){

        console.error(error);

        showLinkError();
    }
}


/* =========================================
   UPDATE PASSWORD
========================================= */

resetForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const password =
            newPassword.value;

        const confirm =
            confirmPassword.value;


        message.textContent = "";


        /* PASSWORD LENGTH */

        if(password.length < 8){

            showMessage(
                "Password must be at least 8 characters.",
                "error"
            );

            newPassword.focus();

            return;
        }


        /* PASSWORD MATCH */

        if(password !== confirm){

            showMessage(
                "New Password and Confirm Password do not match.",
                "error"
            );

            confirmPassword.focus();

            return;
        }


        updateBtn.disabled = true;

        updateBtn.textContent =
            "Updating...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth.updateUser({
                password: password
            });


            if(error){

                console.error(
                    "Password update error:",
                    error
                );

                updateBtn.disabled = false;

                updateBtn.textContent =
                    "Update Password";

                showMessage(
                    "❌ " + error.message,
                    "error"
                );

                return;
            }


            console.log(
                "Password updated:",
                data
            );


            /*
            SUCCESS
            */

            showMessage(
                "✅ Password updated successfully. Redirecting to Login...",
                "success"
            );


            updateBtn.textContent =
                "Password Updated";


            /*
            Clear password fields
            */

            newPassword.value = "";

            confirmPassword.value = "";


            /*
            Sign out and redirect
            */

            setTimeout(
                async function(){

                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "login.html";

                },
                1800
            );


        }catch(error){

            console.error(
                "Unexpected error:",
                error
            );

            updateBtn.disabled = false;

            updateBtn.textContent =
                "Update Password";

            showMessage(
                "❌ Something went wrong. Please try again.",
                "error"
            );
        }

    }
);


/* =========================================
   START PASSWORD RECOVERY CHECK
========================================= */

checkRecoverySession();

</script>

</body>
</html>
