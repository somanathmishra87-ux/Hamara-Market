<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamara Market - Registration</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#777}
.page{max-width:760px;margin:0 auto;padding:22px 28px 40px}
.brand{text-align:center;margin:4px 0 28px}
.logo{display:inline-flex;width:58px;height:58px;border-radius:50%;align-items:center;justify-content:center;background:linear-gradient(135deg,#2458d5,#5538df);color:#fff;font-size:27px;font-weight:800;box-shadow:0 5px 14px #0002}
.brand h1{margin:10px 0 0;color:#1e2d52;font-size:27px}
.brand p{margin:4px 0;color:#777}
.field{margin:0 0 26px}
label{display:block;font-size:18px;margin-bottom:10px;color:#777}
input{width:100%;height:86px;border:1.5px solid #ddd;border-radius:15px;padding:0 26px;font-size:21px;color:#444;outline:none}
input:focus{border-color:#4e3ee5;box-shadow:0 0 0 3px #4e3ee51a}
input::placeholder{color:#7b7f84}
.terms{display:flex;align-items:center;gap:13px;margin:4px 0 8px;font-size:18px}
.terms input{width:40px;height:40px;accent-color:#000;margin:0}
button{width:100%;height:78px;border:0;border-radius:15px;background:linear-gradient(90deg,#5239e9,#4e3ce8);color:#fff;font-size:25px;font-weight:700;cursor:pointer}
.login{margin-top:70px}
.login button{background:#5239e9}
.note{text-align:center;margin-top:18px;font-size:13px;color:#999}
@media(max-width:480px){
.page{padding:18px 28px 32px}
.brand{display:none}
.field{margin-bottom:28px}
label{font-size:18px}
input{height:86px;font-size:20px}
button{height:80px;font-size:24px}
.login{margin-top:70px}
}
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="logo">HM</div>
    <h1>Hamara Market</h1>
    <p>Create your account</p>
  </div>

  <form id="registrationForm">
    <div class="field">
      <label for="address">Address</label>
      <input id="address" type="text" placeholder="Address" required>
    </div>

    <div class="field">
      <label for="mobile">Mobile Number</label>
      <input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter Mobile no." required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Email ID" required>
    </div>

    <div class="field">
      <label for="two">2 Wheeler Number</label>
      <input id="two" type="text" placeholder="2 Wheeler Number">
    </div>

    <div class="field">
      <label for="four">4 Wheeler Number</label>
      <input id="four" type="text" placeholder="4 Wheeler Number">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Password" minlength="8" required>
    </div>

    <label class="terms">
      <input id="terms" type="checkbox" required>
      <span>I agree to Terms and condition</span>
    </label>

    <button type="submit">Sign Up</button>
  </form>

  <div class="login">
    <button type="button" onclick="location.href='login.html'">Already Have Acc.</button>
  </div>

  <div class="note">Hamara Market • Registration</div>
</div>

<script>
document.getElementById('registrationForm').addEventListener('submit', function(e){
  e.preventDefault();
  const mobile=document.getElementById('mobile').value.trim();
  if(!/^[0-9]{10}$/.test(mobile)){alert('Please enter a valid 10-digit mobile number.');return;}
  alert('Registration form submitted. Backend/database connection will be added next.');
});
</script>
</body>
</html>
