<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Hamara Market - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(145deg,#eef3ff,#ffffff);
    color:#17213b;
    min-height:100vh;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    background:#fff;
    border-bottom:1px solid #e4e8f0;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    font-size:25px;
    color:#173b9e;
}

.logo{
    width:52px;
    height:52px;
    border-radius:16px;
    background:linear-gradient(145deg,#2463df,#1847b5);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:800;
    box-shadow:0 8px 20px #245ed933;
}

.signup{
    text-decoration:none;
    background:#2463df;
    color:white;
    padding:13px 20px;
    border-radius:12px;
    font-weight:700;
}

.wrap{
    max-width:470px;
    margin:45px auto;
    padding:0 20px;
}

.card{
    background:#fff;
    border-radius:25px;
    padding:30px 25px;
    box-shadow:0 18px 55px #1d35651c;
    border:1px solid #e9edf5;
}

.title{
    text-align:center;
    font-size:30px;
    margin:4px 0 8px;
}

.sub{
    text-align:center;
    color:#69748b;
    margin:0 0 28px;
}

label{
    display:block;
    font-weight:700;
    margin:17px 0 8px;
}

input{
    width:100%;
    padding:16px;
    border:1px solid #d9deea;
    border-radius:13px;
    font-size:16px;
    outline:none;
    background:#fafbfe;
}

input:focus{
    border-color:#2463df;
    box-shadow:0 0 0 3px #2463df18;
}

.password{
    position:relative;
}

.password input{
    padding-right:55px;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    font-size:20px;
    cursor:pointer;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:17px 0;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:#606b80;
    margin:0;
}

.remember input{
    width:18px;
    height:18px;
}

.forgot{
    color:#2463df;
    text-decoration:none;
    font-weight:700;
    cursor:pointer;
}

.login{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    background:linear-gradient(90deg,#245fe0,#3d48df);
    color:white;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.login:disabled{
    opacity:.65;
}

.or{
    display:flex;
    align-items:center;
    gap:12px;
    color:#929aaa;
    margin:24px 0;
}

.or:before,
.or:after{
    content:"";
    height:1px;
    background:#e3e6ed;
    flex:1;
}

.create{
    display:block;
    text-align:center;
    text-decoration:none;
    border:1px solid #d9e0ed;
    color:#2456b8;
    border-radius:14px;
    padding:15px;
    font-weight:800;
}

.note{
    text-align:center;
    color:#8a93a4;
    font-size:12px;
    margin-top:22px;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#8b93a2;
    font-size:12px;
    margin:22px;
}

.message{
    text-align:center;
    margin-top:14px;
    font-size:14px;
    font-weight:700;
    line-height:1.5;
}

.success{
    color:#16834b;
}

.error{
    color:#d22f2f;
}

@media(max-width:520px){

    .header{
        padding:15px 16px;
    }

    .brand{
        font-size:22px;
    }

    .logo{
        width:48px;
        height:48px;
    }

    .signup{
        padding:11px 15px;
    }

    .wrap{
        margin:28px auto;
    }

    .card{
        padding:27px 20px;
    }

    .row{
        gap:10px;
    }

    .forgot{
        font-size:14px;
    }

}

</style>

</head>

<body>


<header class="header">

    <div class="brand">

        <div class="logo">
            HM
        </div>

        <span>
            Hamara Market
        </span>

    </div>

    <a
        class="signup"
        href="registration.html">

        Sign Up

    </a>

</header>



<main class="wrap">

<section class="card">

<h1 class="title">
    Welcome Back
</h1>

<p class="sub">
    Login to your Hamara Market account
</p>


<form id="loginForm">


<label for="loginId">
    Mobile Number
</label>

<input
    id="loginId"
    type="tel"
    inputmode="numeric"
    maxlength="10"
    placeholder="Enter registered 10-digit mobile"
    autocomplete="username"
    required
>


<label for="password">
    Password
</label>


<div class="password">

<input
    id="password"
    type="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
>

<button
    class="eye"
    type="button"
    onclick="togglePassword()">

    👁

</button>

</div>


<div class="row">

<label class="remember">

<input
    id="remember"
    type="checkbox">

Remember me

</label>


<a
    class="forgot"
    href="#"
    onclick="showForgotMessage(event)">

    Forgot Password?

</a>

</div>


<button
    class="login"
    id="loginBtn"
    type="submit">

    Login

</button>


</form>


<div
    id="loginMessage"
    class="message">
</div>


<div class="or">
    OR
</div>


<a
    class="create"
    href="registration.html">

    Create New Account

</a>


<p class="note">

    Hamara Market • Digital Rewards Platform<br>

    Members: Mobile Number + Password Login

</p>

</section>

</main>


<div class="footer">

© 2026 Hamara Market. All rights reserved.

</div>



<script>


/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
    "https://yaxingstvkaqfmvtyuis.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_3dA1_NPBVCHCzcrf155Qtw_16IUxNDt";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* =====================================================
   PASSWORD SHOW / HIDE
   ===================================================== */

function togglePassword(){

    const password =
        document.getElementById("password");


    if(
        password.type === "password"
    ){

        password.type = "text";

    }else{

        password.type = "password";

    }

}


/* =====================================================
   LOGIN MESSAGE
   ===================================================== */

function showLoginMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "loginMessage"
        );


    message.className =
        "message " + type;


    message.textContent =
        text;

}


/* =====================================================
   MOBILE NUMBER LOGIN
   ===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const loginId =
            document
            .getElementById("loginId")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const button =
            document
            .getElementById("loginBtn");


        /*
          Remove all non-numeric characters.
        */

        const mobile =
            loginId.replace(
                /\D/g,
                ""
            );


        /*
          Validate mobile.
        */

        if(
            !/^[0-9]{10}$/.test(
                mobile
            )
        ){

            showLoginMessage(
                "❌ Please enter a valid 10-digit mobile number.",
                "error"
            );

            return;

        }


        /*
          Validate password.
        */

        if(
            !password
        ){

            showLoginMessage(
                "❌ Please enter your password.",
                "error"
            );

            return;

        }


        button.disabled =
            true;


        button.textContent =
            "Checking...";


        showLoginMessage(
            "",
            ""
        );


        try{

            /* =================================================
               IMPORTANT

               Registration creates Auth email like:

               member.9776333087@auth.hamaramarket.local

               So we create the SAME email here
               directly from the mobile number.

               No profiles.email lookup.
               No Edge Function.
               No SQL required.
               ================================================= */

            const authEmail =
                `member.${mobile}@auth.hamaramarket.local`;


            console.log(
                "Mobile:",
                mobile
            );


            console.log(
                "Auth Email:",
                authEmail
            );


            /* =================================================
               SUPABASE AUTH LOGIN
               ================================================= */

            const {
                data,
                error
            } =
                await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        authEmail,

                    password:
                        password

                });


            /* =================================================
               AUTH ERROR
               ================================================= */

            if(error){

                console.error(
                    "AUTH LOGIN ERROR:",
                    error
                );


                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "Login was not completed."
                );

            }


            /* =================================================
               LOGIN SUCCESS
               ================================================= */

            console.log(
                "Auth User ID:",
                data.user.id
            );


            showLoginMessage(
                "✅ Login successful. Opening Member Dashboard...",
                "success"
            );


            button.textContent =
                "Login Successful";


            /*
              IMPORTANT:

              We are NOT checking profiles.active
              during this TEST phase.

              Your current member has:

              member_id = HM000008
              active = false
              role = member

              We will handle Admin approval later.
            */


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                800
            );


        }catch(error){

            console.error(
                "MEMBER LOGIN ERROR:",
                error
            );


            let message =
                "Login failed. Please check your mobile number and password.";


            if(
                error &&
                error.message
            ){

                const errorText =
                    String(
                        error.message
                    ).toLowerCase();


                if(
                    errorText.includes(
                        "invalid login credentials"
                    )
                ){

                    message =
                        "❌ Invalid mobile number or password.";

                }

                else if(
                    errorText.includes(
                        "email not confirmed"
                    )
                ){

                    message =
                        "❌ This member account is not confirmed.";

                }

                else if(
                    errorText.includes(
                        "user not found"
                    )
                ){

                    message =
                        "❌ Member account not found.";

                }

                else{

                    message =
                        "❌ " +
                        error.message;

                }

            }


            showLoginMessage(
                message,
                "error"
            );


            button.disabled =
                false;


            button.textContent =
                "Login";

        }

    }
);


/* =====================================================
   FORGOT PASSWORD

   Current registration system uses an internal
   Auth email, so normal email password recovery
   is not being used in this TEST version.
   ===================================================== */

function showForgotMessage(event){

    event.preventDefault();


    showLoginMessage(
        "ℹ️ Password reset will be added after member login testing is complete.",
        ""
    );

}


/* =====================================================
   EXISTING SESSION CHECK
   ===================================================== */

async function checkExistingSession(){

    try{

        const {
            data
        } =
            await supabaseClient
            .auth
            .getSession();


        if(
            data &&
            data.session &&
            data.session.user
        ){

            console.log(
                "Existing member session found."
            );

            /*
              For now we do not automatically redirect.
              User can press Login normally.
            */

        }

    }catch(error){

        console.error(
            "SESSION CHECK ERROR:",
            error
        );

    }

}


checkExistingSession();


</script>

</body>
</html>
